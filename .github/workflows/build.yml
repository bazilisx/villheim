name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # full history, so the build number (commits on main) is right
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # The in-game generator runs the blueprint lab's own code. Bundle it fresh, so the DLL always matches the lab.
      - name: Bundle the blueprint lab for the game
        run: |
          node tools/blueprint-lab/lib/build_engine.js
          git diff --quiet -- src/Villheim.Logic/Generator/lab.js || echo "::warning::src/Villheim.Logic/Generator/lab.js was out of date; run node tools/blueprint-lab/lib/build_engine.js and commit it"

      # The build label: on main, the build number (commits on main) and the commit, for example 977-96927ef. On a test
      # branch (look/... or test/...), the main build it starts from, the branch and its commits past main, for example
      # 977+look-memory.4-abc1234. Test branches post their build as the "test-<branch>" release for the updater's test
      # channel (villheim-channel.txt in the profile's plugin folder).
      - name: Build label
        run: |
          SHA=$(git rev-parse --short=7 HEAD)
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "LABEL=$(git rev-list --count HEAD)-$SHA" >> "$GITHUB_ENV"
          else
            case "$GITHUB_REF" in
              refs/heads/look/*|refs/heads/test/*)
                BRANCH=${GITHUB_REF#refs/heads/}
                SLUG=${BRANCH//\//-}
                MAIN=$(git rev-list --count origin/main)
                AHEAD=$(git rev-list --count origin/main..HEAD)
                echo "LABEL=$MAIN+$SLUG.$AHEAD-$SHA" >> "$GITHUB_ENV"
                echo "CHANNEL=$SLUG" >> "$GITHUB_ENV"
                ;;
            esac
          fi

      - name: Build
        run: |
          if [ -n "$LABEL" ]; then dotnet build Villheim.sln -c Release -nologo -p:VillheimLabel="$LABEL"; else dotnet build Villheim.sln -c Release -nologo; fi

      - name: Package for Thunderstore / manual install
        run: |
          mkdir -p package/plugins
          cp src/Villheim/bin/Release/Villheim.dll package/plugins/
          cp src/Villheim.Logic/bin/Release/Villheim.Logic.dll package/plugins/
          # Jint and what it needs, for 'vh gen' (BSD-2-Clause, BSD-3-Clause, MIT; see THIRD_PARTY_NOTICES.md)
          cp src/Villheim.Logic/bin/Release/{Jint,Acornima,System.Runtime.CompilerServices.Unsafe}.dll package/plugins/
          cp THIRD_PARTY_NOTICES.md package/
          cp README.md CHANGELOG.md manifest.json package/
          if [ -f icon.png ]; then cp icon.png package/; fi

      - uses: actions/upload-artifact@v4
        with:
          name: Villheim
          path: package

      # Every push to main replaces the "Latest test build" release. scripts/Villheim-Updater.ps1 installs it from there.
      - name: Publish the latest test build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dev
          cp src/Villheim/bin/Release/Villheim.dll src/Villheim/bin/Release/Villheim.pdb dev/
          cp src/Villheim.Logic/bin/Release/Villheim.Logic.dll src/Villheim.Logic/bin/Release/Villheim.Logic.pdb dev/
          cp src/Villheim.Logic/bin/Release/{Jint,Acornima,System.Runtime.CompilerServices.Unsafe}.dll dev/
          echo "$LABEL" > dev/version.txt
          # the last commit that changed the core; the updater replaces the core only when this changes
          git log -1 --format=%h -- src/Villheim > dev/core.txt
          gh release delete dev-latest --yes --cleanup-tag || true
          gh release create dev-latest dev/* --prerelease --target "$GITHUB_SHA" \
            --title "Latest test build" \
            --notes "Build $LABEL. Installed by scripts/Villheim-Updater.ps1; not a release."

      # A test branch replaces its own "test-<branch>" release. The updater installs it only when the profile's
      # villheim-channel.txt names that branch.
      - name: Publish the test channel build
        if: github.event_name == 'push' && env.CHANNEL != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dev
          cp src/Villheim/bin/Release/Villheim.dll src/Villheim/bin/Release/Villheim.pdb dev/
          cp src/Villheim.Logic/bin/Release/Villheim.Logic.dll src/Villheim.Logic/bin/Release/Villheim.Logic.pdb dev/
          cp src/Villheim.Logic/bin/Release/{Jint,Acornima,System.Runtime.CompilerServices.Unsafe}.dll dev/
          echo "$LABEL" > dev/version.txt
          # the last commit that changed the core; the updater replaces the core only when this changes
          git log -1 --format=%h -- src/Villheim > dev/core.txt
          gh release delete "test-$CHANNEL" --yes --cleanup-tag || true
          gh release create "test-$CHANNEL" dev/* --prerelease --target "$GITHUB_SHA" \
            --title "Test channel: $CHANNEL" \
            --notes "Build $LABEL from the $CHANNEL test branch. Installed by scripts/Villheim-Updater.ps1 when the profile's villheim-channel.txt says $CHANNEL; not a release."
