name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build Villheim.sln -c Release -nologo

      - name: Package for Thunderstore / manual install
        run: |
          mkdir -p package/plugins
          cp src/Villheim/bin/Release/Villheim.dll package/plugins/
          cp src/Villheim.Logic/bin/Release/Villheim.Logic.dll package/plugins/
          cp README.md CHANGELOG.md manifest.json package/
          if [ -f icon.png ]; then cp icon.png package/; fi

      - uses: actions/upload-artifact@v4
        with:
          name: Villheim
          path: package

      # Every push to main replaces the "Latest test build" release. scripts/Villheim-Updater.ps1 installs it from there.
      - name: Publish the latest test build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dev
          cp src/Villheim/bin/Release/Villheim.dll src/Villheim/bin/Release/Villheim.pdb dev/
          cp src/Villheim.Logic/bin/Release/Villheim.Logic.dll src/Villheim.Logic/bin/Release/Villheim.Logic.pdb dev/
          echo "${GITHUB_SHA::7}" > dev/version.txt
          gh release delete dev-latest --yes --cleanup-tag || true
          gh release create dev-latest dev/* --prerelease --target "$GITHUB_SHA" \
            --title "Latest test build" \
            --notes "Built from ${GITHUB_SHA::7}. Installed by scripts/Villheim-Updater.ps1; not a release."
